<style>
  .lf-wrap { --gap: 1rem; }

  .lf-section-title {
    font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.12em;
    color: var(--global-text-color-light); margin: 2rem 0 0.9rem;
    display: flex; align-items: center; gap: 0.6rem;
  }
  .lf-section-title::after { content: ""; flex: 1; height: 1px; background: var(--global-divider-color); }

  /* shared art sizing — applies to both <img> and the .lf-initial fallback */
  .lf-hero-art { width: 64px; height: 64px; border-radius: 8px; object-fit: cover; flex: none; }
  .lf-thumb    { width: 44px; height: 44px; border-radius: 6px; object-fit: cover; flex: none; }
  .lf-cover    { width: 100%; aspect-ratio: 1; border-radius: 10px; object-fit: cover; }
  .lf-initial {
    display: flex; align-items: center; justify-content: center;
    background: hsl(var(--h, 280), 45%, 55%); color: #fff; font-weight: 700; font-size: 1.05rem;
  }
  .lf-cover.lf-initial { font-size: 2.4rem; }

  /* now playing */
  .lf-now {
    display: flex; align-items: center; gap: 1rem;
    background: var(--global-card-bg-color); border: 1px solid var(--global-divider-color);
    border-radius: 12px; padding: 0.9rem 1.1rem; box-shadow: 0 4px 14px rgba(0,0,0,0.05); min-height: 86px;
  }
  .lf-now .t { font-weight: 600; color: var(--global-text-color); }
  .lf-now .a { color: var(--global-text-color-light); font-size: 0.9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lf-badge { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--global-theme-color); display: flex; align-items: center; }
  .lf-eq { display: inline-flex; gap: 2px; align-items: flex-end; height: 12px; margin-right: 6px; }
  .lf-eq span { width: 3px; background: var(--global-theme-color); animation: lf-eq 0.9s ease-in-out infinite; }
  .lf-eq span:nth-child(2) { animation-delay: 0.2s; } .lf-eq span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes lf-eq { 0%, 100% { height: 4px; } 50% { height: 12px; } }

  /* lists */
  .lf-list { display: flex; flex-direction: column; gap: 0.4rem; }
  .lf-row { display: flex; align-items: center; gap: 0.8rem; padding: 0.5rem 0.6rem; border-radius: 8px; transition: background 0.15s; }
  .lf-row:hover { background: rgba(127, 127, 127, 0.08); }
  .lf-row .rank { width: 1.4rem; text-align: right; color: var(--global-text-color-light); font-variant-numeric: tabular-nums; }
  .lf-row .meta { flex: 1; min-width: 0; }
  .lf-row .meta .t { font-weight: 500; color: var(--global-text-color); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lf-row .meta .a { font-size: 0.85rem; color: var(--global-text-color-light); }
  .lf-row .plays { font-size: 0.8rem; color: var(--global-text-color-light); white-space: nowrap; }

  /* two text-only lists side by side (Top Artists | Top Tracks) */
  .lf-twocol { display: grid; grid-template-columns: 1fr 1fr; column-gap: 1.75rem; align-items: start; }
  .lf-twocol .lf-section-title { margin-top: 2rem; }

  /* album grid */
  .lf-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--gap); }
  .lf-album img.lf-cover, .lf-album .lf-cover { transition: transform 0.18s, box-shadow 0.18s; }
  .lf-album:hover .lf-cover { transform: translateY(-3px); box-shadow: 0 8px 18px rgba(0, 0, 0, 0.18); }
  .lf-album .t { font-weight: 500; font-size: 0.85rem; margin-top: 0.45rem; color: var(--global-text-color); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lf-album .a { font-size: 0.78rem; color: var(--global-text-color-light); }

  /* totals */
  .lf-totals { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--gap); }
  .lf-stat { background: var(--global-card-bg-color); border: 1px solid var(--global-divider-color); border-radius: 12px; padding: 1rem; text-align: center; }
  .lf-stat .n { font-size: 1.6rem; font-weight: 700; color: var(--global-theme-color); }
  .lf-stat .l { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--global-text-color-light); }

  /* period toggle */
  .lf-controls { display: flex; align-items: center; gap: 0.8rem; margin: 2.4rem 0 0; flex-wrap: wrap; }
  .lf-controls .label { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--global-text-color-light); }
  .lf-period { display: inline-flex; gap: 0.3rem; flex-wrap: wrap; }
  .lf-period button { font: inherit; font-size: 0.76rem; padding: 0.28rem 0.7rem; border-radius: 999px; border: 1px solid var(--global-divider-color); background: transparent; color: var(--global-text-color-light); cursor: pointer; transition: all 0.15s; }
  .lf-period button:hover { color: var(--global-text-color); border-color: var(--global-text-color-light); }
  .lf-period button.active { background: var(--global-theme-color); color: var(--global-hover-text-color); border-color: var(--global-theme-color); }

  /* skeletons + errors */
  .lf-skel { background: linear-gradient(90deg, rgba(127,127,127,0.10) 25%, rgba(127,127,127,0.22) 37%, rgba(127,127,127,0.10) 63%); background-size: 400% 100%; animation: lf-shimmer 1.4s ease infinite; border-radius: 8px; }
  @keyframes lf-shimmer { 0% { background-position: 100% 0; } 100% { background-position: 0 0; } }
  .lf-list .lf-skel { height: 56px; }
  .lf-grid .lf-skel, .lf-totals .lf-skel { aspect-ratio: 1; height: auto; }
  .lf-err { color: var(--global-text-color-light); font-size: 0.9rem; padding: 0.6rem 0; font-style: italic; }

  @media (max-width: 600px) {
    .lf-grid, .lf-totals { grid-template-columns: repeat(2, 1fr); }
    .lf-twocol { grid-template-columns: 1fr; column-gap: 0; }
  }
</style>

<div class="lf-wrap">
  <div class="lf-section-title">Live Feed</div>
  <div class="lf-now lf-section" id="lf-now"></div>

  <div class="lf-section-title">By the numbers</div>
  <div class="lf-totals lf-section" id="lf-totals"></div>

  <div class="lf-controls">
    <span class="label">Time Span of Top Picks</span>
    <span class="lf-period" id="lf-period">
      <button data-period="7day">7 days</button>
      <button data-period="1month" class="active">month</button>
      <button data-period="12month">year</button>
      <button data-period="overall">all-time</button>
    </span>
  </div>

  <div class="lf-section-title">Top Albums</div>
  <div class="lf-grid lf-section" id="lf-albums"></div>

  <div class="lf-twocol">
    <div class="lf-col">
      <div class="lf-section-title">Top Artists</div>
      <div class="lf-list lf-section" id="lf-artists"></div>
    </div>
    <div class="lf-col">
      <div class="lf-section-title">Top Tracks</div>
      <div class="lf-list lf-section" id="lf-tracks"></div>
    </div>
  </div>

  <div class="lf-section-title">Recently Played</div>
  <div class="lf-list lf-section" id="lf-recent"></div>
</div>

<script>
  // Only the public username here; the (read-only) key lives obfuscated in lastfm.js.
  window.LASTFM = { user: "{{ site.lastfm.username }}" };
</script>
<script src="{{ '/assets/js/lastfm.js' | relative_url }}"></script>
