<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Civ6 Atlas</title>
  <meta name="description" content="An interactive world map of every Civilization VI world wonder, natural wonder and civilization, with real-world photos and history." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <link rel="stylesheet" href="styles.css?v=8" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='7' y='7' width='18' height='18' transform='rotate(45 16 16)' fill='%23d6b25e' stroke='%230b1020' stroke-width='2'/%3E%3C/svg%3E" />
</head>
<body>
  <div id="map" aria-label="World map of Civilization VI wonders"></div>

  <!-- Sidebar: brand, filters, list -->
  <aside class="sidebar glass" id="sidebar" aria-label="Wonder list and filters">
    <header class="brand">
      <div class="brand-mark" aria-hidden="true"></div>
      <div>
        <h1>Civ6 Atlas</h1>
        <p class="brand-sub">World Wonders <i>·</i> Natural Wonders <i>·</i> Civs</p>
      </div>
      <button class="icon-btn only-mobile" id="sidebarClose" aria-label="Close list">✕</button>
    </header>

    <div class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="search" type="search" placeholder="Search wonders, places, eras…" autocomplete="off" spellcheck="false" />
      <kbd class="only-desktop">/</kbd>
    </div>

    <div class="kind-toggle" role="group" aria-label="Wonder type">
      <button class="kind on" data-kind="world" aria-pressed="true">
        <span class="kind-glyph world" aria-hidden="true"></span>World <b id="countWorld">0</b>
      </button>
      <button class="kind on" data-kind="natural" aria-pressed="true">
        <span class="kind-glyph natural" aria-hidden="true"></span>Natural <b id="countNatural">0</b>
      </button>
      <button class="kind on" data-kind="civ" aria-pressed="true">
        <span class="kind-glyph civ" aria-hidden="true"></span>Civs <b id="countCiv">0</b>
      </button>
    </div>

    <div class="eras" id="eras" role="group" aria-label="Filter by era"></div>

    <div class="list-head">
      <span id="showing">Showing all</span>
      <button class="text-btn" id="randomBtn" title="Jump to a random wonder">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>Surprise me
      </button>
    </div>
    <nav class="list" id="list" aria-label="Wonders"></nav>

    <footer class="legend">
      <span><i class="lg world"></i>World wonder <small>(colour = era)</small></span>
      <span><i class="lg natural"></i>Natural wonder</span>
      <span><i class="lg civ"></i>Civilization</span>
      <span><i class="lg approx"></i>Legendary / approximate site</span>
    </footer>
  </aside>

  <button class="fab glass only-mobile" id="sidebarOpen" aria-label="Open the atlas list">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
    Atlas
  </button>

  <!-- Detail panel -->
  <section class="detail glass" id="detail" aria-live="polite" aria-label="Wonder details" hidden>
    <div class="detail-scroll" id="detailBody"></div>
  </section>

  <!-- Map controls -->
  <div class="map-controls" id="mapControls">
    <div class="layers glass" role="group" aria-label="Map style">
      <button data-layer="satellite">Satellite</button>
      <button data-layer="night">Night</button>
      <button data-layer="terrain">Terrain</button>
      <button data-layer="light">Light</button>
    </div>
    <div class="zoom glass">
      <button id="zoomIn" aria-label="Zoom in">+</button>
      <button id="zoomOut" aria-label="Zoom out">−</button>
      <button id="zoomWorld" aria-label="Show whole world" title="Whole world">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>
      </button>
    </div>
  </div>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox" hidden role="dialog" aria-modal="true" aria-label="Photo viewer">
    <button class="lb-close icon-btn" id="lbClose" aria-label="Close photo">✕</button>
    <button class="lb-nav prev" id="lbPrev" aria-label="Previous photo">‹</button>
    <figure>
      <img id="lbImg" alt="" referrerpolicy="no-referrer" />
      <figcaption id="lbCap"></figcaption>
    </figure>
    <button class="lb-nav next" id="lbNext" aria-label="Next photo">›</button>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="data.js?v=8"></script>
  <script src="quotes.js?v=8"></script>
  <script src="civs.js?v=8"></script>
  <script src="app.js?v=8"></script>
</body>
</html>
